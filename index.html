<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>InfoSys — Hệ thống Quản lý</title>

    <!-- External dependencies (Localized for Chrome Extension) -->
    <script src="lib/jsrsasign-all-min.js"></script>
    <script src="lib/lucide.js"></script>
    <link rel="stylesheet" href="lib/leaflet.css" />
    <script src="lib/leaflet.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="lib/chart.js"></script>

    <link rel="stylesheet" href="styles.css?v=20260627_22">

    <!-- PWA -->
    <link rel="manifest" href="manifest.web.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#5b5ef4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfoSys">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="InfoSys">
</head>

<body>

    <!-- Loading overlay -->
    <div id="loading" class="loading-mask">
        <div class="spinner"></div>
        <p>Đang tải dữ liệu...</p>
    </div>

    <!-- Drag & drop overlay -->
    <div id="dropOverlay">
        <div class="drop-message">
            <i data-lucide="upload-cloud" style="width:48px;height:48px;"></i>
            Thả file vào đây để nhập dữ liệu
        </div>
    </div>

    <div class="app-shell">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo">INFO<br>SYS</div>
                    <h1 id="pageTitle">InfoSys</h1>
                </div>
                <button class="sidebar-toggle" type="button" id="sidebarToggleBtn" title="Thu gọn menu">
                    <i data-lucide="panel-left-close" style="width:16px;height:16px;"></i>
                </button>
            </div>

            <nav class="tabs">
                <div class="tab" id="tab_TAT_CA" data-tab="TAT_CA" >
                    <i data-lucide="layers" style="width:18px;height:18px;"></i>
                    <span>Tất cả</span>
                </div>
                <div class="tab" id="tab_LICH" data-tab="LICH" >
                    <i data-lucide="calendar" style="width:18px;height:18px;"></i>
                    <span>Lịch</span>
                </div>
                <div class="tab active" id="tab_GHI_CHU" data-tab="GHI_CHU" >
                    <i data-lucide="book-open" style="width:18px;height:18px;"></i>
                    <span>Ghi chú</span>
                </div>
                <div class="tab" id="tab_CHI_TIEU" data-tab="CHI_TIEU" >
                    <i data-lucide="wallet" style="width:18px;height:18px;"></i>
                    <span>Chi tiêu</span>
                </div>
                <div class="tab" id="tab_CONG_VIEC" data-tab="CONG_VIEC" >
                    <i data-lucide="check-square" style="width:18px;height:18px;"></i>
                    <span>Công việc</span>
                </div>
                <div class="tab" id="tab_HOC_HOI" data-tab="HOC_HOI" >
                    <i data-lucide="lightbulb" style="width:18px;height:18px;"></i>
                    <span>Học hỏi</span>
                </div>
                <div class="tab" id="tab_BANG_TAM" data-tab="BANG_TAM" >
                    <i data-lucide="clipboard-list" style="width:18px;height:18px;"></i>
                    <span>Bảng tạm</span>
                </div>
                <div class="tab" id="tab_MK" data-tab="MK" >
                    <i data-lucide="key" style="width:18px;height:18px;"></i>
                    <span>Mật khẩu</span>
                </div>
                <div class="tab" id="tab_DSNV" data-tab="DSNV" >
                    <i data-lucide="users" style="width:18px;height:18px;"></i>
                    <span>Con người</span>
                </div>
                <div class="tab" id="tab_THONG_KE" data-tab="THONG_KE" >
                    <i data-lucide="pie-chart" style="width:18px;height:18px;"></i>
                    <span>Thống kê</span>
                </div>
                <div class="tab" id="tab_THEM" data-tab="THEM" >
                    <i data-lucide="plus-circle" style="width:18px;height:18px;"></i>
                    <span>Thêm nhanh</span>
                </div>
            </nav>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">

            <!-- Header / filter bar -->
            <div class="header-container">
                <div id="headerActions">
                    
                    <!-- Global Search -->
                    <div class="search-container global-search" style="position:relative;">
                        <i data-lucide="globe" class="search-icon" style="width:16px;height:16px;color:#3b82f6;"></i>
                        <input type="text" id="globalSearchInput" class="search-input"
                            placeholder="Tìm toàn cục..."
                             style="border-color:#bfdbfe; background:#eff6ff;">
                        <div id="globalSearchResults" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-top:5px; max-height:400px; overflow-y:auto; z-index:100; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);">
                        </div>
                    </div>

                    <!-- Local Search -->
                    <div class="search-container">
                        <i data-lucide="search" class="search-icon" style="width:16px;height:16px;"></i>
                        <input type="text" id="searchInput" class="search-input"
                            placeholder="Tìm kiếm nhanh..."
                            >
                    </div>

                    <!-- Date filter -->
                    <div id="dateFilterContainer" style="display:flex;flex-direction:column;gap:5px;">
                        <div class="date-filter-row">
                            Từ:
                            <input type="date" id="dateFromFilter" class="filter-input" >
                            Đến:
                            <input type="date" id="dateToFilter" class="filter-input" >
                        </div>
                        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="today">Hôm nay</button>
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="yesterday">Hôm qua</button>
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="this_week">Tuần này</button>
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="this_month">Tháng này</button>
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="7_days">7 ngày</button>
                            <button type="button" class="tag-btn" data-action="quick-filter-date" data-value="all" style="background:#f4f6fb;">Tất cả</button>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <button id="reloadBtn" type="button" >
                        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Load lại
                    </button>

                    <button id="viewToggleBtn" type="button" 
                        style="display:none; background:#5b5ef4; color:#fff; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.84rem; display:none; align-items:center; gap:6px;">
                        <i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i> Kanban
                    </button>

                    <button id="batchEditPhanLoaiBtn" type="button" 
                        style="display:none; background:var(--primary); color:#fff; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.84rem;">
                        Sửa phân loại
                    </button>
                    <button id="batchEditGioiTinhBtn" type="button" 
                        style="display:none; background:var(--primary); color:#fff; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.84rem;">
                        Sửa giới tính
                    </button>
                    <button id="batchEditHashtagBtn" type="button" 
                        style="display:none; background:var(--primary); color:#fff; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.84rem;">
                        Sửa hashtag
                    </button>
                    <button id="batchDeleteBtn" type="button" 
                        style="display:none; background:#ef4444; color:#fff; border:none; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.84rem;">
                        Xóa chọn
                    </button>

                    <button class="add-btn" type="button" id="addRecordBtn">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i>
                        Thêm mới
                    </button>

                    <input type="file" id="fileInput" hidden multiple accept=".xlsx,.xls,.csv"
                        >
                </div>

                <!-- Category filter chips (injected by JS) -->
                <div id="phanLoaiFilterContainer"></div>

                <!-- Order-specific filters (shown/hidden by JS) -->
                <div id="orderFilters" class="order-filters" style="display:none;"></div>
                <div id="returnOrderControls" class="order-filters" style="display:none;"></div>
            </div>

            <!-- Dashboard areas (shown/hidden by JS) -->
            <div id="expenseDashboard"   class="expense-dashboard" style="display:none;"></div>
            <div id="taskDashboard"      class="expense-dashboard" style="display:none; margin-bottom:20px;"></div>
            <div id="todayDashboard"     style="display:none; margin-bottom:20px;"></div>
            <div id="calendarDashboard"  style="display:none; margin-bottom:20px;"></div>
            <div id="analyticsDashboard" style="display:none; margin-bottom:20px;"></div>
            <div id="kanbanDashboard"    style="display:none; margin-bottom:20px;"></div>
            <div id="allDashboard"       style="display:none; gap: 20px; overflow-x: auto; margin-bottom:20px; align-items: flex-start; padding-bottom: 10px;"></div>

            <!-- Quick-add panel (THEM tab) -->
            <div id="quickAddDashboard" style="display:none; gap:16px; align-items:stretch; padding-bottom:20px; height:calc(100vh - 130px);"></div>

            <!-- Data table (desktop) -->
            <div class="table-wrapper" id="tableWrapper">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Mobile card list -->
            <div id="mobileListView" class="mobile-list-view" style="display:none;"></div>

            <!-- Pagination -->
            <div id="pagination" class="pagination"></div>
        </main>
    </div>

    <!-- ===== RECORD FORM MODAL ===== -->
    <div class="modal-mask" id="productModal" data-modal="productModal">
        <form class="modal" id="productForm">
            <div class="modal-header">
                <h2 id="productModalTitle">Thêm mới</h2>
                <button type="button" class="icon-btn" data-action="close-product-form" title="Đóng">
                    <i data-lucide="x" style="width:18px;height:18px;"></i>
                </button>
            </div>
            <input type="hidden" id="editingSheetRow">
            <div id="formFields" class="form-fields"></div>
            <div class="modal-actions">
                <button type="button" id="deleteRecordBtn" class="delete-record-btn"  style="display:none;">
                    <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
                    Xóa
                </button>
                <div style="display:flex;gap:10px;margin-left:auto;">
                    <button type="button" class="secondary-btn" data-action="close-product-form">Hủy</button>
                    <button type="submit" class="primary-btn">
                        <i data-lucide="save" style="width:15px;height:15px;"></i>
                        Lưu
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- ===== ORDER DETAIL MODAL ===== -->
    <div class="modal-mask" id="orderDetailModal" data-modal="orderDetailModal">
        <div class="modal order-detail-modal">
            <div class="modal-header">
                <h2 id="orderDetailTitle">Chi tiết đơn hàng</h2>
                <button type="button" class="icon-btn" data-action="close-order-detail" title="Đóng">
                    <i data-lucide="x" style="width:18px;height:18px;"></i>
                </button>
            </div>
            <div id="orderDetailFields" class="order-detail-fields"></div>
            <div class="order-items-wrapper">
                <table>
                    <thead id="orderDetailHead"></thead>
                    <tbody id="orderDetailBody"></tbody>
                </table>
            </div>
            <div class="order-item-actions">
                <button type="button" class="secondary-btn" id="addDonHangItemBtn">
                    <i data-lucide="plus" style="width:15px;height:15px;"></i>
                    Thêm sản phẩm
                </button>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary-btn" data-action="close-order-detail">Đóng</button>
                <button type="button" class="primary-btn" id="saveDonHangDetailBtn">
                    <i data-lucide="save" style="width:15px;height:15px;"></i>
                    Lưu thay đổi
                </button>
            </div>
        </div>
    </div>

    <!-- ===== BATCH EDIT MODAL ===== -->
    <div class="modal-mask" id="batchEditModal" style="display:none;"
        data-modal="batchEditModal">
        <div class="modal" style="width:460px;height:auto;max-height:80vh;border-radius:14px;margin:auto;">
            <div class="modal-header">
                <h2 id="batchEditModalTitle">Sửa hàng loạt</h2>
                <button type="button" class="icon-btn" data-action="close-batch-edit" title="Đóng">
                    <i data-lucide="x" style="width:18px;height:18px;"></i>
                </button>
            </div>
            <div class="form-fields" style="grid-template-columns:1fr; overflow-y:auto; max-height:50vh;">
                <label>
                    <span id="batchEditModalLabel" style="font-weight:600; font-size:12px; color:#64748b; margin-bottom:5px; display:block;">GIÁ TRỊ MỚI</span>
                    <input type="text" id="batchEditPhanLoaiInput" placeholder="Nhập hoặc chọn..." style="margin-bottom:8px;" >
                    <div id="batchEditTagButtons" class="tag-buttons" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                </label>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary-btn" data-action="close-batch-edit">Hủy</button>
                <button type="button" class="primary-btn" id="executeBatchEditBtn">
                    <i data-lucide="save" style="width:15px;height:15px;"></i>
                    Lưu
                </button>
            </div>
        </div>
    </div>

    <!-- ===== ADD SELECTION MODAL ===== -->
    <div class="modal-mask" id="addSelectionModal" style="display:none;"
        data-modal="addSelectionModal">
        <div class="modal" style="width:300px;height:auto;border-radius:14px;margin:auto;">
            <div class="modal-header">
                <h2>Chọn loại dữ liệu</h2>
                <button type="button" class="icon-btn" data-action="close-add-selection" title="Đóng">
                    <i data-lucide="x" style="width:18px;height:18px;"></i>
                </button>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;padding:10px;">
                <button class="add-btn" style="width:100%;justify-content:center;" data-action="open-record-dash" data-tab-name="GHI_CHU">
                    <i data-lucide="book-open" style="width:16px;height:16px;"></i> Ghi chú
                </button>
                <button class="add-btn" style="width:100%;justify-content:center;" data-action="open-record-dash" data-tab-name="CHI_TIEU">
                    <i data-lucide="wallet" style="width:16px;height:16px;"></i> Chi tiêu
                </button>
                <button class="add-btn" style="width:100%;justify-content:center;" data-action="open-record-dash" data-tab-name="CONG_VIEC">
                    <i data-lucide="check-square" style="width:16px;height:16px;"></i> Công việc
                </button>
                <button class="add-btn" style="width:100%;justify-content:center;" data-action="open-record-dash" data-tab-name="HOC_HOI">
                    <i data-lucide="lightbulb" style="width:16px;height:16px;"></i> Học hỏi
                </button>
            </div>
        </div>
    </div>

    <!-- ===== DAY VIEW MODAL ===== -->
    <div class="modal-mask" id="dayViewModal" style="display:none;"
        data-modal="dayViewModal">
        <div class="modal" style="width:400px;height:auto;max-height:80vh;border-radius:14px;margin:auto;">
            <div class="modal-header">
                <h2 id="dayViewTitle">Chi tiết ngày</h2>
                <button type="button" class="icon-btn" data-action="close-day-view" title="Đóng">
                    <i data-lucide="x" style="width:18px;height:18px;"></i>
                </button>
            </div>
            <div id="dayViewList" style="padding: 10px;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="core/globals.js"></script>
    <script src="core/utils.js"></script>
    <script src="core/api.js"></script>
    <script src="core/ui.js"></script>
    <script src="modules/chi_tieu.js"></script>
    <script src="modules/cong_viec.js"></script>
    <script src="modules/ghi_chu.js"></script>
    <script src="modules/mk.js"></script>
    <script src="modules/tat_ca.js"></script>
    <script src="modules/thong_ke.js"></script>
    <script src="modules/nhac_nho.js"></script>
    <script src="core/init.js"></script>
    <script src="quick_add.js?v=20260627_22"></script>
    <script src="calendar.js?v=20260627_22"></script>

    <!-- PWA: Service Worker + Notifications -->
    <script src="core/pwa.js"></script>
    <script src="core/events.js"></script>
</body>

</html>
